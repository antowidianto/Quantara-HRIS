{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hris.fullname" . }}-redis
  labels:
    {{- include "hris.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    {{- include "hris.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
{{- end }}
