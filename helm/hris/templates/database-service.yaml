{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hris.fullname" . }}-mysql
  labels:
    {{- include "hris.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  ports:
    - port: {{ .Values.mysql.service.port }}
      targetPort: 3306
      protocol: TCP
      name: mysql
  selector:
    {{- include "hris.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
{{- end }}
