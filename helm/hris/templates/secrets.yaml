apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hris.fullname" . }}-secrets
  labels:
    {{- include "hris.labels" . | nindent 4 }}
type: Opaque
data:
  jwt.secret: {{ .Values.backend.env.jwtSecret | b64enc | quote }}
  jwt.refreshSecret: {{ .Values.backend.env.jwtRefreshSecret | b64enc | quote }}
  encryption.key: {{ .Values.backend.env.encryptionKey | b64enc | quote }}
  database.default.password: {{ .Values.mysql.auth.password | b64enc | quote }}
  database.replica.password: {{ .Values.mysql.auth.password | b64enc | quote }}
  mysql-root-password: {{ .Values.mysql.auth.rootPassword | b64enc | quote }}
