apiVersion: v1
kind: Service
metadata:
  name: {{ include "hris.fullname" . }}-frontend
  labels:
    {{- include "hris.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "hris.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
