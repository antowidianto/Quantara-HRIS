apiVersion: v1
kind: Service
metadata:
  name: {{ include "hris.fullname" . }}-middleware
  labels:
    {{- include "hris.labels" . | nindent 4 }}
    app.kubernetes.io/component: middleware
spec:
  type: {{ .Values.middleware.service.type }}
  ports:
    - port: {{ .Values.middleware.service.port }}
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    {{- include "hris.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: middleware
