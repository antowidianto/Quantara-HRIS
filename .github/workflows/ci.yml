name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, json, openssl, sqlite3, gd, zip, xml, curl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: Get composer cache dir
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php83-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan static analysis
        working-directory: backend
        run: composer stan

      - name: Migration integrity
        working-directory: backend
        run: composer migration:check

      - name: Fresh SQLite migration runtime
        working-directory: backend
        run: composer migration:fresh-sqlite

      - name: Permission seed coverage
        working-directory: backend
        run: composer permission:check

      - name: Reject new protected routes without authorization policy
        working-directory: backend
        run: composer route:check

      - name: Tenant isolation static gate
        working-directory: backend
        run: composer tenant:check

      - name: Reject tracked secrets and production-data artifacts
        working-directory: backend
        run: composer repository:sensitive-check

      - name: PHPUnit
        working-directory: backend
        run: composer test

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Reject new hardcoded visible UI strings
        working-directory: frontend
        run: npm run i18n:check

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright critical paths
        working-directory: frontend
        run: npm run test:e2e

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080

  migration-mysql:
    name: Fresh migrations (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hris_migration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, json, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Apply and verify all migrations
        working-directory: backend
        run: composer migration:fresh-mysql
        env:
          MIGRATION_DB_HOST: 127.0.0.1
          MIGRATION_DB_PORT: 3306
          MIGRATION_DB_USER: root
          MIGRATION_DB_PASSWORD: root
          MIGRATION_DB_NAME: hris_migration
