# Mobile CI — HRIS React Native
#
# Triggered di setiap push/PR yang menyentuh `mobile/`. Jalankan:
#   1. Install dependency
#   2. TypeScript check (`tsc --noEmit`)
#   3. Lint (eslint)
#   4. Unit test (jest)
#
# Build native (Android APK, iOS IPA) butuh runner berkapasitas besar
# (Android SDK, Xcode) dan biasanya di-trigger lewat tag release.
# Untuk MVP, hanya verify kode di-PR. Native build di-defer ke
# CI separate (Bitrise / Codemagic / GitHub Actions self-hosted).

name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  verify:
    name: TS + Lint + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript check
        run: npm run tsc

      - name: Lint
        run: npm run lint
        continue-on-error: true   # eslint config belum selesai; warn dulu

      - name: Unit tests
        run: npm test -- --ci --reporters=default --reporters=summary

  android-build-check:
    name: Android Gradle dry-run
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/mobile-')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS deps
        run: npm ci
        working-directory: mobile

      - name: Gradle assembleDebug (dry)
        run: ./gradlew assembleDebug --dry-run
        working-directory: mobile/android
        continue-on-error: true   # baru aktif setelah `init-native.sh` jalan